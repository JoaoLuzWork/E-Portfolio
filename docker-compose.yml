services:
  apache:
    image: httpd:latest
    container_name: apache-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/local/apache2/htdocs
      - apache-logs:/usr/local/apache2/logs
    restart: unless-stopped
    networks:
      - apache-network
 
volumes:
  apache-logs:
    driver: local
 
networks:
  apache-network:
    driver: bridge
 