<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact João Pedro Luz Rodrigues — open to internships, part-time roles, and collaborations in software development.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lobster&family=Lora:ital,wght@0,400;0,700&family=Playfair+Display:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="./img/fav.ico">
    <link rel="stylesheet" href="./style/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" defer></script>
    <script src="./src/script.js" defer></script>
    <title>João Pedro Luz — Contact</title>
</head>
<body>
    <header id="header"></header>
    <main class="wrapper">
        <div class="layoutStandardInfo">
            <h1>Get in Touch</h1>
            <div class="rounded contactbox">
                <p>
                    I am currently a BSc Computing student at Dublin Business School and I am open to internships, part-time roles in tech, and collaborations on interesting projects. Feel free to reach out — I always reply.
                </p>
                <form id="contactForm" action="mailto:joao.pedro.luz.work@gmail.com" method="get" novalidate>
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div>
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <p id="formError" class="formError" role="alert" aria-live="polite"></p>
                    <button class="btn btn-primary" type="submit">Send Message</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="mainFoot" id="footer"></footer>
</body>
</html>
